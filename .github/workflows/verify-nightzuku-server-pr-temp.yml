name: Verify Nightzuku server

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify server compile
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle :server:assembleDebug --stacktrace --no-daemon
