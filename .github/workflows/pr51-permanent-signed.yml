name: Nightzuku PR51 permanent signed APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code above installed app
        required: true
        default: '48'
permissions:
  contents: read
jobs:
  signed:
    if: github.actor == 'joselofarias-byte'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIGHTZUKU_KEYSTORE_BASE64: ${{ secrets.NIGHTZUKU_KEYSTORE_BASE64 }}
      NIGHTZUKU_KEYSTORE_PASSWORD: ${{ secrets.NIGHTZUKU_KEYSTORE_PASSWORD }}
      NIGHTZUKU_KEY_ALIAS: ${{ secrets.NIGHTZUKU_KEY_ALIAS }}
      NIGHTZUKU_KEY_PASSWORD: ${{ secrets.NIGHTZUKU_KEY_PASSWORD }}
      EXPECTED_CERT: a0aa7a8eecbc38a22f81ffe4e713914c1a810e11ab8e8f507b03b3d54df9b496
    steps:
      - name: Checkout PR51 signing branch
        uses: actions/checkout@v4
        with:
          ref: build/pr51-permanent-signed
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 2075ca2dc6f801dce86f3908a65551f21e807c7f HEAD
          [[ "${{ inputs.version_code }}" =~ ^[0-9]+$ ]]
          test "${{ inputs.version_code }}" -gt 47
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android dependencies
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent keystore
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$NIGHTZUKU_KEYSTORE_BASE64"
          test -n "$NIGHTZUKU_KEYSTORE_PASSWORD"
          test -n "$NIGHTZUKU_KEY_ALIAS"
          test -n "$NIGHTZUKU_KEY_PASSWORD"
          printf '%s' "$NIGHTZUKU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nightzuku-release.jks"
          chmod 600 "$RUNNER_TEMP/nightzuku-release.jks"
          echo "NIGHTZUKU_KEYSTORE_FILE=$RUNNER_TEMP/nightzuku-release.jks" >> "$GITHUB_ENV"
      - name: Set version and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build.gradle")
          s=p.read_text()
          old="def gitCommitCount = 47"
          assert s.count(old)==1
          p.write_text(s.replace(old,"def gitCommitCount = ${{ inputs.version_code }}"))
          PY
          bash ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a :manager:testDebugUnitTest :manager:assembleRelease
      - name: Verify package and certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out/permanent
          mapfile -t APKS < <(find out/apk -maxdepth 1 -type f -name '*-release.apk')
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > out/permanent/certificate.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/permanent/certificate.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED_CERT"
          "$TOOLS/aapt" dump badging "$APK" > out/permanent/badging.txt
          grep -F "package: name='com.joselofarias.nightzuku'" out/permanent/badging.txt
          grep -F "versionCode='${{ inputs.version_code }}'" out/permanent/badging.txt
          grep -Fx "native-code: 'arm64-v8a'" out/permanent/badging.txt
          cp "$APK" out/permanent/Nightzuku-PR51-permanent-arm64.apk
          (cd out/permanent && sha256sum Nightzuku-PR51-permanent-arm64.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: nightzuku-pr51-permanent-arm64
          path: out/permanent/
          if-no-files-found: error
          retention-days: 14
