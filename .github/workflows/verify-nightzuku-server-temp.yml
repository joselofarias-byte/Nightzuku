name: Temporary Nightzuku server verify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify server compile
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew :server:assembleDebug --stacktrace --no-daemon
