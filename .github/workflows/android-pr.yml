name: Android PR build

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'research/**'
  pull_request:
    branches:
      - main
      - feature/adb-mdns-endpoint
      - feature/adb-tcp-persistence
      - fix/nightdog-adb-tcp-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIGHTZUKU_KEYSTORE_BASE64: ${{ secrets.NIGHTZUKU_KEYSTORE_BASE64 }}
      NIGHTZUKU_KEYSTORE_PASSWORD: ${{ secrets.NIGHTZUKU_KEYSTORE_PASSWORD }}
      NIGHTZUKU_KEY_ALIAS: ${{ secrets.NIGHTZUKU_KEY_ALIAS }}
      NIGHTZUKU_KEY_PASSWORD: ${{ secrets.NIGHTZUKU_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore root Gradle wrapper jar
        run: |
          test -f api/gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          cp api/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore permanent signing keystore
        if: env.NIGHTZUKU_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NIGHTZUKU_KEYSTORE_PASSWORD"
          test -n "$NIGHTZUKU_KEY_ALIAS"
          test -n "$NIGHTZUKU_KEY_PASSWORD"
          printf '%s' "$NIGHTZUKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nightzuku-release.jks"
          chmod 600 "$RUNNER_TEMP/nightzuku-release.jks"
          echo "NIGHTZUKU_KEYSTORE_FILE=$RUNNER_TEMP/nightzuku-release.jks" >> "$GITHUB_ENV"

      - name: Build manager debug APK
        run: ./gradlew --no-daemon --stacktrace :manager:assembleDebug

      - name: Build permanently signed release APK
        if: env.NIGHTZUKU_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon --stacktrace :manager:assembleRelease

      - name: Verify release certificate
        if: env.NIGHTZUKU_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find manager/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK" | tee release-certificate.txt

      - name: Upload manager debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-manager-debug-${{ github.sha }}
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload permanently signed release APK
        if: success() && env.NIGHTZUKU_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-manager-release-signed-${{ github.sha }}
          path: |
            manager/build/outputs/apk/release/*.apk
            release-certificate.txt
          if-no-files-found: error
          retention-days: 30
