name: Android PR build

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'research/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - feature/adb-mdns-endpoint
      - feature/adb-tcp-persistence
      - fix/nightdog-adb-tcp-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Obtener revisión del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Verificar revisión
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
          echo "BUILD_HEAD_SHA=$ACTUAL_HEAD_SHA" >> "$GITHUB_ENV"
          echo "BUILD_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android del proyecto
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Preparar caché Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Sin secretos ni clave release: signing.gradle utiliza la firma debug del SDK.
      - name: Ejecutar pruebas unitarias
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./gradlew --no-daemon --stacktrace --console=plain \
            -Pandroid.injected.build.abi=arm64-v8a testDebugUnitTest

      - name: Compilar APK debug ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./gradlew --no-daemon --stacktrace --console=plain \
            -Pandroid.injected.build.abi=arm64-v8a :manager:assembleDebug

      - name: Verificar firma, paquete, ABI y revisión; generar SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          APKS=(out/apk/*-debug.apk)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out/pr-arm64
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" \
            | tee out/pr-arm64/certificado-debug.txt
          "$TOOLS/aapt" dump badging "$APK" > out/pr-arm64/apk-badging.txt
          grep -F "package: name='com.joselofarias.nightzuku'" out/pr-arm64/apk-badging.txt
          grep -F ".$BUILD_SHORT_SHA'" out/pr-arm64/apk-badging.txt
          grep -Fx "native-code: 'arm64-v8a'" out/pr-arm64/apk-badging.txt
          "$TOOLS/aapt" dump permissions "$APK" > out/pr-arm64/permisos.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > out/pr-arm64/manifest.txt
          cp "$APK" "out/pr-arm64/nightzuku-arm64-debug-$BUILD_SHORT_SHA.apk"
          printf '%s\n' "$BUILD_HEAD_SHA" > out/pr-arm64/build-head-sha.txt
          (
            cd out/pr-arm64
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          {
            echo '### Nightzuku: APK ARM64 de pruebas'
            echo "Revisión: $BUILD_HEAD_SHA"
            echo 'Firma debug temporal; no reemplaza una instalación con otra firma.'
            echo 'Android 16 / HONOR 200 físico: validación pendiente.'
            echo '```text'
            cat out/pr-arm64/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK ARM64, SHA-256 y metadatos
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-arm64-debug-${{ env.BUILD_SHORT_SHA }}
          path: out/pr-arm64/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar resultados de pruebas incluso si fallan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-pruebas-${{ env.BUILD_SHORT_SHA }}
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
