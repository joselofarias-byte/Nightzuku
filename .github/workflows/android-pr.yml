name: Android PR build

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'research/**'
  pull_request:
    branches:
      - main
      - feature/adb-mdns-endpoint
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Restore root Gradle wrapper jar
        run: |
          test -f api/gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          cp api/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build manager debug APK
        run: ./gradlew --no-daemon --stacktrace :manager:assembleDebug

      - name: Upload manager APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-manager-debug-${{ github.sha }}
          path: manager/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
