name: Temporary Nightzuku permission migration port

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  port:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply selective server migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          config = Path('server/src/main/java/rikka/shizuku/server/ShizukuConfigManager.java')
          s = config.read_text()
          if 'public List<Integer> getAllowedUids()' not in s:
              anchor = '''    private void updateLocked(int uid, List<String> packages, int mask, int values) {'''
              block = '''    public List<Integer> getAllowedUids() {
        synchronized (this) {
            List<Integer> result = new ArrayList<>();
            for (ShizukuConfig.PackageEntry entry : config.packages) {
                if ((entry.flags & ConfigManager.FLAG_ALLOWED) != 0) {
                    result.add(entry.uid);
                }
            }
            return result;
        }
    }

'''
              if anchor not in s:
                  raise SystemExit('ShizukuConfigManager anchor missing')
              s = s.replace(anchor, block + anchor, 1)
          config.write_text(s)

          service = Path('server/src/main/java/rikka/shizuku/server/ShizukuService.java')
          s = service.read_text()
          if 'private void migratePermissionGrants()' not in s:
              anchor = '''    public ShizukuService() {
        super();'''
              block = '''    private void migratePermissionGrants() {
        List<Integer> allowedUids = configManager.getAllowedUids();
        if (allowedUids.isEmpty()) {
            return;
        }
        LOGGER.i("migratePermissionGrants: checking %d authorized UIDs", allowedUids.size());
        int migrated = 0;
        for (int uid : allowedUids) {
            int userId = UserHandleCompat.getUserId(uid);
            for (String packageName : PackageManagerApis.getPackagesForUidNoThrow(uid)) {
                PackageInfo pi = Android17Compat.getPackageInfo(packageName, PackageManager.GET_PERMISSIONS, userId);
                if (pi == null || pi.requestedPermissions == null || !ArraysKt.contains(pi.requestedPermissions, PERMISSION)) {
                    continue;
                }
                try {
                    Android17Compat.grantRuntimePermission(packageName, PERMISSION, userId);
                    migrated++;
                } catch (Throwable e) {
                    LOGGER.w(e, "migratePermissionGrants: grant failed for %s", packageName);
                }
            }
        }
        LOGGER.i("migratePermissionGrants: granted/refreshed %d permission(s)", migrated);
    }

'''
              if anchor not in s:
                  raise SystemExit('ShizukuService constructor anchor missing')
              s = s.replace(anchor, block + anchor, 1)

          old = '''        mainHandler.post(() -> {
            sendBinderToClient();
            sendBinderToManager();
        });'''
          new = '''        mainHandler.post(() -> {
            migratePermissionGrants();
            sendBinderToClient();
            sendBinderToManager();
        });'''
          if 'migratePermissionGrants();' not in s:
              if old not in s:
                  raise SystemExit('ShizukuService startup anchor missing')
              s = s.replace(old, new, 1)
          service.write_text(s)
          PY

          git diff --check
          grep -q 'public List<Integer> getAllowedUids()' server/src/main/java/rikka/shizuku/server/ShizukuConfigManager.java
          grep -q 'private void migratePermissionGrants()' server/src/main/java/rikka/shizuku/server/ShizukuService.java
          grep -q 'migratePermissionGrants();' server/src/main/java/rikka/shizuku/server/ShizukuService.java
          ./gradlew :server:compileDebugJavaWithJavac --stacktrace
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/main/java/rikka/shizuku/server/ShizukuConfigManager.java server/src/main/java/rikka/shizuku/server/ShizukuService.java
          git commit -m 'fix(server): restore runtime grants for persisted permissions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
