name: Fresh Nightzuku Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore tracked wrapper jar and build manager
        run: |
          cp api/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew :manager:assemble --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nightzuku-apks-fresh
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 14
