name: OPPO Assist

on:
  pull_request:
  push:
    paths:
      - "oppo-assist/**"
      - ".github/workflows/oppo-assist.yml"

permissions:
  contents: read

jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          if [[ ! -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools-unpack
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-unpack
            mv /tmp/cmdtools-unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Pruebas Python
        run: python3 -m unittest discover -s oppo-assist/termux/tests -v

      - name: Pruebas del cliente Termux
        run: bash oppo-assist/termux/tests/test_jolufa_cli.sh

      - name: Pruebas JVM y APK de depuración
        working-directory: oppo-assist
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :core:test :agent:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: oppo-assist-debug-apk
          path: oppo-assist/agent/build/outputs/apk/debug/*.apk
